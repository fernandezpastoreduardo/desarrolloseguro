server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header_inherit merge;

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /desarrollo-seguro/index.html =404;
    }

    location = /desarrollo-seguro {
        return 308 /desarrollo-seguro/;
    }

    location = /desarrollo-seguro/ {
        add_header Cache-Control "no-cache" always;
        try_files /desarrollo-seguro/index.html =404;
    }

    location ^~ /desarrollo-seguro/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* "^/app/assets/.+[.-][A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /app/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /api/desarrollo-seguro/v1/ {
        proxy_pass https://development-security-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_ssl_server_name on;
        proxy_ssl_name development-security-api;
        proxy_ssl_trusted_certificate /run/secrets/internal_tls_ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
    }

    location / {
        return 404;
    }
}
