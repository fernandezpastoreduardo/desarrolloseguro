name: CI/CD Desarrollo Seguro

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorize_deploy:
        description: Autorizar el deploy de Desarrollo Seguro a desarrolloseguro.org
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.5.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migrations, static policies, lint, types, unit tests, build, and sandbox checks
        run: pnpm ci:verify quality

  e2e:
    name: Browser tests (Playwright)
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.5.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @desarrolloseguro/web exec playwright install chromium
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Run privacy-preserving Lighthouse laboratory gate
        run: pnpm test:lighthouse

  postgres-integration:
    name: PostgreSQL integration
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg19-trixie
        env:
          POSTGRES_DB: development_security_test_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: development-security-test-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d development_security_test_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.5.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run PostgreSQL integration tests
        run: pnpm ci:verify postgres
        env:
          DS_TEST_POSTGRES_ISOLATED: "1"
          DS_TEST_DATABASE_URL: postgresql://postgres:development-security-test-admin-password@127.0.0.1:5432/development_security_test_admin

  dependency-audit:
    name: Dependency audit
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.5.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm ci:verify audit

  build-and-scan-images:
    name: Build and scan production images
    if: github.ref == 'refs/heads/main' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production images
        shell: bash
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --target development-security-production --tag "desarrolloseguro-api:${IMAGE_REVISION}" .
          docker build --pull --target development-security-web --tag "desarrolloseguro-web:${IMAGE_REVISION}" .
          docker build --pull --build-arg "DS_RELEASE_REVISION=${IMAGE_REVISION}" --target development-security-worker --tag "desarrolloseguro-worker:${IMAGE_REVISION}" .
          docker build --pull --target development-security-runtime-coordinator --tag "desarrolloseguro-runtime:${IMAGE_REVISION}" .
          docker build --pull --target development-security-executor --tag "desarrolloseguro-executor:${IMAGE_REVISION}" .
          docker build --pull --target development-security-egress-broker --tag "desarrolloseguro-egress-broker:${IMAGE_REVISION}" .
          docker build --pull --target development-security-privacy-browser --tag "desarrolloseguro-privacy-browser:${IMAGE_REVISION}" .
          docker build --pull --target development-security-privacy-egress --tag "desarrolloseguro-privacy-egress:${IMAGE_REVISION}" .
          docker build --pull --file docker/postgres/Dockerfile --tag desarrolloseguro-postgres:pg19-candidate .
          docker pull pgvector/pgvector:0.8.7-pg17-bookworm
      - name: Smoke test production API image
        run: bash scripts/test-development-security-production-smoke.sh "desarrolloseguro-api:${GITHUB_SHA}"
      - name: Smoke test consent and provider controls in isolated Chromium
        shell: bash
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --user 1000:1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --cpus 0.5 \
            --shm-size 128m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000 \
            --entrypoint node \
            "desarrolloseguro-privacy-browser:${IMAGE_REVISION}" \
            /workspace/apps/desarrollo-seguro/worker/scripts/privacy-browser-fixture-smoke.mjs
      - name: Smoke test runtime coordinator Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --entrypoint /usr/bin/docker \
            "desarrolloseguro-runtime:${GITHUB_SHA}" --version
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan production images for high and critical vulnerabilities
        shell: bash
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -uo pipefail
          report_dir="$RUNNER_TEMP/desarrollo-seguro-trivy-reports"
          raw_report_dir="$RUNNER_TEMP/desarrollo-seguro-trivy-raw-reports"
          mkdir -p "$report_dir"
          mkdir -p "$raw_report_dir"
          scan_failed=0
          if ! node --test scripts/trivy-report-summary.spec.mjs; then
            scan_failed=1
          fi
          for component in api web worker runtime executor egress-broker privacy-browser privacy-egress; do
            image="desarrolloseguro-${component}:${IMAGE_REVISION}"
            report="$report_dir/${component}.json"
            printf 'Scanning image: %s\n' "$image"
            if ! trivy image \
              --scanners vuln \
              --pkg-types os,library \
              --severity HIGH,CRITICAL \
              --timeout 15m \
              --format json \
              --output "$report" \
              --exit-code 0 \
              "$image"; then
              scan_failed=1
            fi
          done
          database_image=desarrolloseguro-postgres:pg19-candidate
          report="$report_dir/database-pg19-candidate.json"
          raw_report="$raw_report_dir/database-pg19-candidate-all-findings.json"
          printf 'Scanning image: %s\n' "$database_image"
          if ! trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --timeout 15m \
            --format json \
            --output "$raw_report" \
            --exit-code 0 \
            "$database_image"; then
            scan_failed=1
          fi
          if ! trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --timeout 15m \
            --format json \
            --output "$report" \
            --exit-code 0 \
            "$database_image"; then
            scan_failed=1
          fi
          if ! TARGET_IMAGE="$database_image" bash scripts/test-postgres-major-upgrade.sh; then
            scan_failed=1
          fi
          if ! node scripts/trivy-report-summary.mjs "$report_dir"; then
            scan_failed=1
          fi
          exit "$scan_failed"
      - name: Preserve vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desarrollo-seguro-trivy-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desarrollo-seguro-trivy-reports/*.json
            ${{ runner.temp }}/desarrollo-seguro-trivy-raw-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Desarrollo Seguro
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorize_deploy
    needs: [quality-gates, e2e, postgres-integration, dependency-audit, build-and-scan-images]
    runs-on: ubuntu-24.04
    environment: desarrollo-seguro-production
    concurrency:
      group: desarrollo-seguro-production-deploy
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Prepare restricted SSH access
        shell: bash
        env:
          DS_DEPLOY_SSH_KEY: ${{ secrets.DS_DEPLOY_SSH_KEY }}
          DS_DEPLOY_KNOWN_HOSTS: ${{ secrets.DS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$DS_DEPLOY_SSH_KEY" || -z "$DS_DEPLOY_KNOWN_HOSTS" ]]; then
            printf 'development_security_deploy_ssh_not_configured\n' >&2
            exit 2
          fi
          install -d -m 0700 "$RUNNER_TEMP/desarrollo-seguro-ssh"
          printf '%s\n' "$DS_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/desarrollo-seguro-ssh/id_ed25519"
          printf '%s\n' "$DS_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/desarrollo-seguro-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/desarrollo-seguro-ssh/id_ed25519" "$RUNNER_TEMP/desarrollo-seguro-ssh/known_hosts"
      - name: Deploy only Desarrollo Seguro
        shell: bash
        env:
          DS_DEPLOY_HOST: ${{ secrets.DS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "$DS_DEPLOY_HOST" ]]; then
            printf 'development_security_deploy_host_not_configured\n' >&2
            exit 2
          fi
          git archive --format=tar "$GITHUB_SHA" |
            ssh \
              -i "$RUNNER_TEMP/desarrollo-seguro-ssh/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/desarrollo-seguro-ssh/known_hosts" \
              "dsdeploy@$DS_DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public web and API health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 5 --retry-all-errors --fail --silent --show-error --max-time 15 \
            https://desarrolloseguro.org/app/ --output /dev/null
          curl --retry 10 --retry-delay 5 --retry-all-errors --fail --silent --show-error --max-time 15 \
            https://desarrolloseguro.org/api/desarrollo-seguro/v1/health --output /dev/null
      - name: Verify canonical www redirect and live Grumphya scan
        run: node scripts/smoke-public-domain-scan.mjs
      - name: Verify the self-domain report scores 100 with source evidence
        env:
          DS_SMOKE_HOSTNAME: desarrolloseguro.org
        run: node scripts/smoke-public-domain-scan.mjs
