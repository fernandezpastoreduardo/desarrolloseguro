name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: development_security_test_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: development-security-test-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d development_security_test_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DS_TEST_POSTGRES_ISOLATED: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:development-security-test-admin-password@127.0.0.1:5432/development_security_test_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static policies, lint, types, tests, and build
        run: pnpm ci:verify quality
      - name: Run PostgreSQL integration tests
        run: pnpm ci:verify postgres
      - name: Build the production API image
        run: docker build --pull --target development-security-production --tag desarrolloseguro-api:${{ github.sha }} .
      - name: Smoke test the production API image
        run: bash scripts/test-development-security-production-smoke.sh desarrolloseguro-api:${{ github.sha }}
      - name: Audit dependencies
        run: pnpm ci:verify audit
