name: Deploy Desarrollo Seguro

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar Desarrollo Seguro en el VPS
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: desarrollo-seguro-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: [self-hosted, linux, x64, desarrollo-seguro-deploy]
    environment: desarrollo-seguro-production
    timeout-minutes: 45
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Deploy only Desarrollo Seguro
        run: sudo --non-interactive -- ./scripts/deploy-development-security-analysis.sh
